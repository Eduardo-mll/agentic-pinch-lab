spec_version: 1
name: scientific_analyst
description: Interpret experiment results and choose the next scientific decision.

instructions: AGENTS.md

executor:
  type: omnigent
  config:
    harness: claude-sdk
  model: claude-haiku-4-5
  auth:
    type: api_key
    api_key: ${ANTHROPIC_API_KEY}

os_env:
  type: caller_process
  cwd: ../../..
  sandbox:
    type: none

tools:
  run_experiment:
    type: function
    description: Re-read or re-run an experiment if needed. Never invent numbers.
    callable: pinch_lab.tools.omnigent_tools.tool_run_experiment
    parameters:
      type: object
      properties:
        delta_t_min:
          type: number
      required: [delta_t_min]
